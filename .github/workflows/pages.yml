name: Publicar pagina

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          if [ -d malote ]; then
            echo "site_path=malote" >> "$GITHUB_ENV"
          else
            echo "site_path=." >> "$GITHUB_ENV"
          fi

      - name: Corregir posicion de banners
        run: |
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/image-position-fix.css" ]; then
            printf '\n\n/* Correcciones de posicion inyectadas al publicar */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/image-position-fix.css" >> "${site_path}/blog-editor.css"
          fi

      - name: Activar guardado en la nube
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/cloud-sync.js" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          site = Path(os.environ.get("site_path", "."))
          index = site / "index.html"
          text = index.read_text(encoding="utf-8")
          marker = '<script src="script.js"></script>'
          cloud = '<script src="cloud-sync.js"></script>\n'
          if 'src="cloud-sync.js"' not in text and marker in text:
              text = text.replace(marker, cloud + marker, 1)
              index.write_text(text, encoding="utf-8")
          PY

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.site_path }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
