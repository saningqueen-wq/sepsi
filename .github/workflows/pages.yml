name: Publicar pagina

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          if [ -d malote ]; then
            echo "site_path=malote" >> "$GITHUB_ENV"
          else
            echo "site_path=." >> "$GITHUB_ENV"
          fi

      - name: Corregir posicion de banners
        run: |
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/image-position-fix.css" ]; then
            printf '\n\n/* Correcciones de posicion inyectadas al publicar */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/image-position-fix.css" >> "${site_path}/blog-editor.css"
          fi
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/photocard-fix.css" ]; then
            printf '\n\n/* Fondo.jpg como photocard */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/photocard-fix.css" >> "${site_path}/blog-editor.css"
          fi
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/happy-birthday-decoration.css" ]; then
            printf '\n\n/* Decoracion Amino para Happy Birthday */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/happy-birthday-decoration.css" >> "${site_path}/blog-editor.css"
          fi

      - name: Activar guardado en la nube
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/cloud-sync.js" ]; then
            if ! grep -q 'src="cloud-sync.js"' "${site_path}/index.html"; then
              sed -i '/<script src="script.js"><\/script>/i\<script src="cloud-sync.js"><\/script>' "${site_path}/index.html"
            fi
          fi

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.site_path }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
