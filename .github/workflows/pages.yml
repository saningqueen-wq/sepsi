name: Publicar pagina

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          if [ -d malote ]; then
            echo "site_path=malote" >> "$GITHUB_ENV"
          else
            echo "site_path=." >> "$GITHUB_ENV"
          fi

      - name: Corregir posicion de banners
        run: |
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/image-position-fix.css" ]; then
            printf '\n\n/* Correcciones de posicion inyectadas al publicar */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/image-position-fix.css" >> "${site_path}/blog-editor.css"
          fi
          if [ -f "${site_path}/blog-editor.css" ] && [ -f "${site_path}/photocard-fix.css" ]; then
            printf '\n\n/* Fondo.jpg como photocard */\n' >> "${site_path}/blog-editor.css"
            cat "${site_path}/photocard-fix.css" >> "${site_path}/blog-editor.css"
          fi

      - name: Cargar decoracion de Happy Birthday
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/happy-birthday-decoration.css" ]; then
            sed -i '/happy-birthday-decoration.css/d' "${site_path}/index.html"
            sed -i '/<\/head>/i\    <link rel="stylesheet" href="happy-birthday-decoration.css?v=9">' "${site_path}/index.html"
          fi

      - name: Cargar decoracion de My World With You
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/my-world-decoration.css" ]; then
            sed -i '/my-world-decoration.css/d' "${site_path}/index.html"
            sed -i '/<\/head>/i\    <link rel="stylesheet" href="my-world-decoration.css?v=1">' "${site_path}/index.html"
          fi

      - name: Activar guardado en la nube
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/cloud-sync.js" ]; then
            if ! grep -q 'src="cloud-sync.js"' "${site_path}/index.html"; then
              sed -i '/<script src="script.js"><\/script>/i\<script src="cloud-sync.js"><\/script>' "${site_path}/index.html"
            fi
          fi

      - name: Cargar texto actualizado de Happy Birthday
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/happy-birthday-text-patch.js" ]; then
            sed -i '/happy-birthday-text-patch.js/d' "${site_path}/index.html"
            sed -i '/<script src="blog-editor.js"><\/script>/a\<script src="happy-birthday-text-patch.js?v=1"><\/script>' "${site_path}/index.html"
          fi

      - name: Cargar promesa y referencia entre blogs
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/relationship-promise-patch.js" ]; then
            sed -i '/relationship-promise-patch.js/d' "${site_path}/index.html"
            sed -i '/<script src="happy-birthday-text-patch.js?v=1"><\/script>/a\<script src="relationship-promise-patch.js?v=1"><\/script>' "${site_path}/index.html"
          fi

      - name: Cargar avatar de princesa en comentario y fichas
        run: |
          if [ -f "${site_path}/index.html" ] && [ -f "${site_path}/princesa-avatar-patch.js" ]; then
            sed -i '/princesa-avatar-patch.js/d' "${site_path}/index.html"
            sed -i '/<script src="relationship-promise-patch.js?v=1"><\/script>/a\<script src="princesa-avatar-patch.js?v=3"><\/script>' "${site_path}/index.html"
          fi

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.site_path }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
